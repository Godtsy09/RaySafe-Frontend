<header class="header">
  <span class="brand">RaySafe</span>

  <div class="center">
    <button class="btn-agentes" type="button" routerLink="/agent-list">Agentes en la institución</button>
    <a routerLink="/register-agent" class="nav-link">Agregar Agentes</a>
    <a routerLink="/agent-logs" class="nav-link">Registros</a>
  </div>

  <div class="profile">
    <span class="admin-name">{{ usuario()?.name ?? 'Administrador' }}</span>
    <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
    <button type="button" class="btn-logout" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>
</header>
