<header class="header">
  <span class="brand">RaySafe</span>
  
  <div class="center">
    <button class="btn-agentes" type="button" routerLink="/agent-list" routerLinkActive="active">Agentes en la institución</button>
    <a routerLink="/register-agent" routerLinkActive="active" class="nav-link">Agregar Agentes</a>
    <a routerLink="/agent-logs" routerLinkActive="active" class="nav-link">Registros</a>
  </div>

  <div class="profile">
    <span class="admin-name">{{ usuario()?.name ?? 'Administrador' }}</span>
    <div class="avatar-menu">
      <button
        class="avatar"
        type="button"
        (click)="toggleMenu()"
        aria-haspopup="true"
        [attr.aria-expanded]="menuAbierto"
        aria-label="Menú de usuario"
      >{{ iniciales() }}</button>
      @if (menuAbierto) {
        <div class="avatar-dropdown" role="menu">
          <button class="avatar-dropdown-item" type="button" role="menuitem" (click)="cerrarSesion()">Cerrar sesión</button>
        </div>
      }
    </div>
  </div>
</header>
