<app-header-user></app-header-user>
<div class="login-container">

    <div class="hero-section">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <span class="badge">ACCESO INSTITUCIONAL</span>
            <h2>Solo para agentes y <span>administradores autorizados.</span></h2>
        </div>
    </div>

    <div class="form-section">
        <div class="form-wrapper">
            <h1 class="brand-title">RaySafe</h1>
            <h2 class="form-title">Login</h2>
            <p class="form-subtitle">Ingresa con tus credenciales institucionales.</p>

            @if (mensaje()) {
                <div class="mensaje-aviso" role="status">{{ mensaje() }}</div>
            }

            @if (error()) {
                <div class="mensaje-error" role="alert">{{ error() }}</div>
            }

            <form (ngSubmit)="iniciarSesion()">
                <div class="form-group">
                    <label for="email">EMAIL</label>
                    <input
                    type="email"
                    id="email"
                    name="email"
                    [(ngModel)]="email"
                    placeholder="nombre@pnc.gob.gt"
                    autocomplete="username"
                    required
                    />
                </div>

                <div class="form-group">
                    <label for="password">CONTRASEÑA</label>
                    <input
                    type="password"
                    id="password"
                    name="password"
                    [(ngModel)]="password"
                    placeholder="contraseña"
                    autocomplete="current-password"
                    required
                    />
                </div>

                <button type="submit" class="btn-submit" [disabled]="cargando()">
                    {{ cargando() ? 'ingresando…' : 'ingrese al sistema' }}
                </button>
            </form>
        </div>
    </div>
</div>
