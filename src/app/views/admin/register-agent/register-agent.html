<app-header-admin></app-header-admin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

<main class="register-container">
<h1 class="page-title">Registrar nuevo agente</h1>

<section class="card-form">

<span class="subtitle">DATOS PARA REGISTRAR</span>

<form class="form" (submit)="registrar($event)">
    <div class="form-group">
        <label for="name">NOMBRE *</label>
        <input
        type="text"
        id="name"
        placeholder="nombre"
        required
        [(ngModel)]="formData.name"
        name="name"
        [disabled]="submitting()"
        />
    </div>

    <div class="form-group">
        <label for="email">EMAIL *</label>
        <input
        type="email"
        id="email"
        placeholder="nombre@dominio.com"
        required
        [(ngModel)]="formData.email"
        name="email"
        [disabled]="submitting()"
        />
    </div>

    <div class="form-group">
        <label for="password">CONTRASEÑA *</label>
        <input
        type="password"
        id="password"
        placeholder="contraseña"
        required
        [(ngModel)]="formData.password"
        name="password"
        [disabled]="submitting()"
        />
    </div>

    <div class="role-selector">
        <input type="radio" id="role-agent" name="role" value="agent" [(ngModel)]="formData.role" [disabled]="submitting()">
        <label for="role-agent" class="role-btn">Agente</label>
        <input type="radio" id="role-admin" name="role" value="admin" [(ngModel)]="formData.role" [disabled]="submitting()">
        <label for="role-admin" class="role-btn">Admin</label>
    </div>

    @if (error()) {
      <div class="error-message">{{ error() }}</div>
    }

    @if (success()) {
      <div class="success-message">{{ successMessage() }} Redirigiendo...</div>
    }

    <button type="submit" class="submit-btn" [disabled]="submitting()">
      {{ submitting() ? 'Creando...' : 'Ingrese al sistema' }}
    </button>

</form>
</section>
</main>
