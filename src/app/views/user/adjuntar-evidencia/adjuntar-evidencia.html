<div class="modal-overlay">
  <div class="modal-box">

    <div class="modal-header">
      <h2 class="modal-title">Subir evidencias</h2>
      <button type="button" class="modal-close" aria-label="Cerrar">✕</button>
    </div>

    <div class="modal-body">
      <p class="modal-text">
        Los archivos son cifrados en tránsito y en reposo.
        Solo las autoridades con acceso al caso pueden verlos.
      </p>

      <div class="dropzone">
        <p class="dropzone-text">Seleccione o arrastre archivos</p>
        <p class="dropzone-hint">JPG · PNG · MP4 · PDF</p>
        <input type="file" class="dropzone-input" multiple hidden />
      </div>

      <button type="button" class="btn-confirm">confirmar archivos</button>
    </div>

  </div>
</div>
